name: Sovereign static pilot CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-security:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check worker.js
          node --check sw.js
      - name: No-backend and privacy invariants
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,re,sys
          p=pathlib.Path('.')
          html=(p/'index.html').read_text()
          js=(p/'app.js').read_text()
          sw=(p/'sw.js').read_text()
          readme=(p/'README.md').read_text()
          privacy=(p/'privacy.html').read_text()
          required=['PBKDF2','AES-GCM','indexedDB','600000','local_only']
          # local_only is a policy word; this standalone static app uses no remote executor.
          for key in required[:-1]:
              assert key in js, 'Missing expected crypto/storage mechanism '+key
          assert "worker-src 'self'" in html and "connect-src 'self'" in html
          assert "serviceWorker" in js and "caches.open" in sw
          assert "pilot" in readme.lower() and "minor" in readme.lower()
          assert "parola" in privacy and "serverului" in privacy
          assert not re.search(r'https?://',js), 'No external endpoints allowed in application JS'
          assert not re.search(r'\b(eval|Function)\s*\(',js), 'Dynamic JS execution forbidden'
          assert not re.search(r'WebSocket\s*\(',js), 'No background agent bridge in static pilot'
          for file in ['index.html','app.js','style.css','worker.js','sw.js','privacy.html']:
              assert (p/file).stat().st_size>100
          assert not (p/'.env').exists()
          print('PASS: static pilot privacy, local encryption, no external JS egress')
          PY
